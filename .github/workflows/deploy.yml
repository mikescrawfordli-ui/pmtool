name: Deploy to Firebase Hosting

# Every push to main builds the app and publishes it. Pull requests get their
# own temporary preview URL so a change can be looked at before it goes live.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: pm-tool-4d33e
          # Pushes to main go live; pull requests get a preview channel.
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
